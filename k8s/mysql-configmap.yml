apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: default
data:
  MYSQL_DATABASE: "elearning_db"
  MYSQL_USER: "elearning"
  mysql-init.sql: |
    CREATE DATABASE IF NOT EXISTS elearning_db;
    USE elearning_db;
    -- Initialization scripts can be added here
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/elearning_db"
  SPRING_DATASOURCE_USERNAME: "elearning"
